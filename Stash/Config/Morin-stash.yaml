# Morin-stash 公共模板：节点字段为占位符，替换后才能使用。
# Morin-stash：2026-10-03。规则集均从自己的仓库调用；未添加 TikTok 专用分流。
# 局域网直连优先，广告拦截；国内默认直连，国外默认英国伦敦；AI 与 Crypto 保留独立分组。
# 不设置规则集自定义缓存 path；Build 1319 启动仍需在手机复测。
mode: rule
log-level: info
proxy-providers: {}
proxies:
  - name: 英国伦敦
    type: vless
    server: node.example.invalid
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    encryption: YOUR_VLESS_ENCRYPTION
    tls: true
    sni: www.example.com
    client-fingerprint: chrome
    reality-opts:
      public-key: YOUR_REALITY_PUBLIC_KEY
      short-id: YOUR_REALITY_SHORT_ID
      support-x25519mlkem768: true
    network: xhttp
    xhttp-opts:
      mode: auto
      path: /YOUR_XHTTP_PATH
    udp: true
dns:
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - 223.5.5.5
    - 119.29.29.29
  fake-ip-filter:
    - '*.cmpassport.com'
    - '*.jegotrip.com.cn'
    - '*.icitymobile.mobi'
    - id6.me
http:
  force-http-engine:
    - '*:80'
proxy-groups:
  - name: 兜底分流
    type: select
    proxies:
      - 英国伦敦
    interval: -1
  - name: AI
    type: select
    proxies:
      - 英国伦敦
    interval: -1
  - name: Telegram
    type: select
    proxies:
      - 英国伦敦
    interval: -1
  - name: X
    type: select
    proxies:
      - 英国伦敦
    interval: -1
  - name: InternationalStreaming
    type: select
    proxies:
      - 英国伦敦
    interval: -1
  - name: Crypto
    type: select
    proxies:
      - 英国伦敦
    interval: -1
  - name: 所有节点
    type: select
    interval: 86400
    lazy: true
    proxies:
      - 英国伦敦
  - name: 自动选择
    type: url-test
    interval: 86400
    lazy: true
    proxies:
      - 英国伦敦
  - name: 英国节点
    type: url-test
    interval: 86400
    lazy: true
    proxies:
      - 英国伦敦
  - name: 国内网站
    type: select
    proxies:
      - DIRECT
      - 英国伦敦
  - name: 国外网站
    type: select
    proxies:
      - 英国伦敦
rules:
  - RULE-SET,Lan,DIRECT
  - RULE-SET,Adblock,REJECT
  - RULE-SET,AI,AI
  - RULE-SET,OpenAI,AI
  - RULE-SET,Crypto,Crypto
  - RULE-SET,Apple,国内网站
  - RULE-SET,Google,国外网站
  - RULE-SET,Microsoft,国内网站
  - RULE-SET,WeChat,国内网站
  - RULE-SET,Telegram,Telegram
  - RULE-SET,X,X
  - RULE-SET,YouTube,InternationalStreaming
  - RULE-SET,Streaming,InternationalStreaming
  - RULE-SET,China,国内网站
  - RULE-SET,Global,国外网站
  - GEOIP,CN,国内网站
  - MATCH,国外网站
rule-providers:
  Adblock:
    type: http
    behavior: domain
    format: yaml
    url: https://raw.githubusercontent.com/Jason3u/Personal-Proxy-Config/main/Stash/Rule/Adblock.yaml
    interval: 86400
  Apple:
